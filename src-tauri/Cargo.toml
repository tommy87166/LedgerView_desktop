[package]
name = "ledgerview-desktop"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# The 1.20000.x crates bundle the DuckDB 2.0.0 engine.
duckdb = { version = "=1.20000.2", features = ["bundled", "parquet", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
tempfile = "3"
fs2 = "0.4"
sha2 = "0.10"
subtle = "2.6"
anyhow = "1"
dunce = "1"
rmcp = { version = "3.11", features = ["transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
schemars = "1"
open = "5"
rust_xlsxwriter = { version = "0.103.0", features = ["constant_memory"] }
mcpmesh-local-api = { version = "0.58", features = ["service"] }
dirs = "7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[profile.dev]
debug = 0

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
calamine = "0.38.0"
tokio = { version = "1", features = ["process", "test-util"] }

name: Desktop tests and builds

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: --no-bundle
            artifact: src-tauri/target/x86_64-pc-windows-msvc/release/LedgerView.exe
          - platform: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: --bundles app
            artifact: LedgerView-macOS-arm64.app.zip
    env:
      RUSTUP_TOOLCHAIN: stable
      # Use the static MSVC runtime for the executable and its bundled C++ code.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Type-check and build the desktop app
        run: npm run tauri -- build --ci --target ${{ matrix.target }} ${{ matrix.bundle }} -- --locked
      - name: Prepare isolated updater test using the packaged app
        run: python .github/scripts/test_update_package.py "src-tauri/target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'LedgerView.exe' || 'bundle/macos/LedgerView.app' }}" "${{ runner.temp }}/lv-update-test"
      - name: Run Rust integration tests with bundled DuckDB
        env:
          LEDGERVIEW_TEST_UPDATE_DIR: ${{ runner.temp }}/lv-update-test
          LEDGERVIEW_TEST_STDIO_BIN: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'LedgerView.exe' || 'bundle/macos/LedgerView.app/Contents/MacOS/LedgerView' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --target ${{ matrix.target }} --features tauri/custom-protocol
      - name: Verify the portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-Item '${{ matrix.artifact }}'
          $imports = & llvm-readobj --file-headers --coff-imports $exe.FullName | Out-String
          if ($LASTEXITCODE -ne 0 -or $imports -notmatch 'IMAGE_FILE_MACHINE_AMD64') {
            throw 'Expected an x64 Windows executable'
          }
          if ($imports -match '(?im)^\s*Name: (duckdb|WebView2Loader|VCRUNTIME\w*|MSVCP\w*)\.dll\s*$') {
            throw "Portable executable has an external runtime dependency: $($Matches[1])"
          }
      - name: Verify and archive the macOS app
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/LedgerView.app"
          test -x "$app/Contents/MacOS/LedgerView"
          lipo "$app/Contents/MacOS/LedgerView" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "${{ matrix.artifact }}"
      - name: Upload the tested build
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.artifact }}
          archive: false
          if-no-files-found: error

      - name: Package the tested macOS bundle for in-app updates
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          COPYFILE_DISABLE=1 tar -czf LedgerView.app.tar.gz -C "$bundle" LedgerView.app
      - name: Upload macOS update package
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: LedgerView.app.tar.gz
          archive: false
          if-no-files-found: error

  release:
    name: Sign updates and publish the tested release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - name: Verify tag and fetch artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_updates.py fetch
      - name: Sign and verify update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LEDGERVIEW_UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: python3 .github/scripts/release_updates.py sign
      - name: Publish assets and update feed together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --title "LedgerView $GITHUB_REF_NAME" --generate-notes
